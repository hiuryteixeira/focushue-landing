<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-translate="config_page_title">Configurações - FocusHue</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <style>
    /* Estilos ... */
  </style>
</head>
<body>

  <main id="configContainer" style="display: none;">
    <div id="statusMessage"></div>
    
    <div class="config-section">
      <h2 data-translate="user_preferences">Preferências do Usuário</h2>
      <label for="tema" data-translate="app_theme">Tema do App:</label>
      <select id="tema">
        <option value="light" data-translate="theme_light">Claro</option>
        <option value="dark" data-translate="theme_dark">Escuro</option>
      </select>

      <label for="idioma" data-translate="language">Idioma:</label>
      <select id="idioma">
        <option value="pt" data-translate="lang_portuguese">Português</option>
        <option value="en" data-translate="lang_english">Inglês</option>
        <option value="es" data-translate="lang_spanish">Espanhol</option>
      </select>
    </div>

    <div class="config-section">
      <h2 data-translate="notifications">Notificações</h2>
      <div class="checkbox-container">
        <input type="checkbox" id="notifInicioBloco" />
        <label for="notifInicioBloco" data-translate="notify_block_start">Notificar início de blocos</label>
      </div>
      <div class="checkbox-container">
        <input type="checkbox" id="notifTerminoFoco" />
        <label for="notifTerminoFoco" data-translate="notify_focus_end">Notificar término de foco</label>
      </div>
      <div class="checkbox-container">
        <input type="checkbox" id="notifLembreteDescanso" />
        <label for="notifLembreteDescanso" data-translate="rest_reminder">Lembrete para descanso</label>
      </div>
    </div>

    <div class="config-section">
      <h2 data-translate="other_options">Outras Opções</h2>
      <button onclick="salvarConfiguracoes()" data-translate="save_changes">Salvar Alterações</button>
    </div>
  </main>

  <div id="mensagemLogin" style="display: none;">
    <p data-translate="login_to_see_config">Você precisa estar logado para ver e editar suas configurações.</p>
    <p><a href="login.html" data-translate="do_login">Fazer Login</a> ou <a href="cadastro.html" data-translate="create_account">Criar Conta</a></p>
  </div>

  <footer data-translate="footer_text">
    © 2025 FocusHue™ — Sistema Cromático de Foco.
  </footer>

  <script src="menu.js"></script>
  <script src="i18n.js"></script>
  <script>
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    
    const configContainer = document.getElementById('configContainer');
    const mensagemLogin = document.getElementById('mensagemLogin');
    const statusMessage = document.getElementById('statusMessage');
    
    const temaSelect = document.getElementById('tema');
    const idiomaSelect = document.getElementById('idioma');
    const notifInicioBloco = document.getElementById('notifInicioBloco');
    const notifTerminoFoco = document.getElementById('notifTerminoFoco');
    const notifLembreteDescanso = document.getElementById('notifLembreteDescanso');

    function mostrarMensagem(mensagem, tipo) {
      statusMessage.textContent = mensagem;
      statusMessage.className = tipo;
      statusMessage.style.display = 'block';
      setTimeout(() => { statusMessage.style.display = 'none'; }, 3000);
    }
    
    async function carregarConfiguracoes() {
      if (!currentUser) return;
      
      try {
        const docRef = db.collection("users").doc(currentUser.uid).collection("config").doc("preferencias");
        const doc = await docRef.get();
        
        if (doc.exists) {
          const data = doc.data();
          if (data.tema) {
            temaSelect.value = data.tema;
          }
          if (data.idioma) {
            idiomaSelect.value = data.idioma;
          }
          if (data.notificacoes) {
            notifInicioBloco.checked = data.notificacoes.inicioBloco || false;
            notifTerminoFoco.checked = data.notificacoes.terminoFoco || false;
            notifLembreteDescanso.checked = data.notificacoes.lembreteDescanso || false;
          }
        }
      } catch (error) {
        console.error("Erro ao carregar configurações:", error);
      }
    }
    
    async function salvarConfiguracoes() {
      if (!currentUser) {
        mostrarMensagem("Você precisa estar logado para salvar configurações.", "error");
        return;
      }
      
      try {
        const configData = {
          tema: temaSelect.value,
          idioma: idiomaSelect.value,
          notificacoes: {
            inicioBloco: notifInicioBloco.checked,
            terminoFoco: notifTerminoFoco.checked,
            lembreteDescanso: notifLembreteDescanso.checked
          },
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        await db.collection("users").doc(currentUser.uid).collection("config").doc("preferencias").set(configData);
        
        // Aplica as configurações imediatamente
        aplicarTema(configData.tema);
        await setLanguage(configData.idioma);
        
        mostrarMensagem(translations[currentLanguage]?.config_saved_success || "Configurações salvas com sucesso!", "success");
        
      } catch (error) {
        console.error("Erro ao salvar configurações:", error);
        mostrarMensagem((translations[currentLanguage]?.error_saving_config || "Erro ao salvar configurações: {message}").replace('{message}', error.message), "error");
      }
    }
    
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        configContainer.style.display = 'block';
        mensagemLogin.style.display = 'none';
        carregarConfiguracoes();
      } else {
        currentUser = null;
        configContainer.style.display = 'none';
        mensagemLogin.style.display = 'block';
      }
    });
  </script>
</body>
</html>
