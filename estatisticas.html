<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-translate="stats_page_title">Estatísticas - FocusHue</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>/* Estilos... */</style>
</head>
<body>

  <div id="statusMessage"></div>

  <main id="estatisticasContainer" style="display: none;">
    <div class="filtro">
      <label for="periodo" data-translate="filter_by">Filtrar por:</label>
      <select id="periodo" onchange="filtrarDados()">
        <option value="hoje" data-translate="period_today">Hoje</option>
        <option value="semana" data-translate="period_week">Esta Semana</option>
        <option value="mes" data-translate="period_month">Este Mês</option>
      </select>
    </div>

    <div class="loader" id="loader"></div>

    <div class="stats-cards" id="statsCards"></div>

    <canvas id="graficoPizza" width="400" height="400"></canvas>

    <div id="noDataMessage" style="display: none;" class="no-data">
      <span data-translate="no_stats_data">Não há dados de estatísticas para este período.</span>
      <div>
        <button class="simulate-btn" onclick="simularDados()" data-translate="generate_example_data">Gerar Dados de Exemplo</button>
      </div>
    </div>
  </main>

  <div id="mensagemLogin" style="display: none;">
    <p data-translate="login_to_see_stats">Você precisa estar logado para ver suas estatísticas.</p>
    <p><a href="login.html" data-translate="do_login">Fazer Login</a> ou <a href="cadastro.html" data-translate="create_account">Criar Conta</a></p>
  </div>

  <footer data-translate="footer_text">
    © 2025 FocusHue™ — Sistema Cromático de Foco.
  </footer>

  <script src="menu.js"></script>
  <script src="i18n.js"></script>
  <script>
    // Script da página...
  </script>
</body>
</html>
