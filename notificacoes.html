<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-translate="notifications_page_title">Notificações - FocusHue</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <style>/* Estilos... */</style>
</head>
<body>

<div id="statusMessage"></div>

<div id="notificacoesContainer" style="display: none;">
  <section class="notificacoes-container" id="listaNotificacoes">
    <!-- Notificações serão carregadas aqui -->
  </section>

  <div class="notificacao-form">
    <input type="time" id="hora" required data-translate="notification_time_placeholder" placeholder="Hora" />
    <input type="text" id="mensagem" data-translate="notification_message_placeholder" placeholder="Mensagem da notificação" />
    <select id="modo">
      <option value="estudo" data-translate="option_estudo">Estudo</option>
      <option value="foco" data-translate="option_foco">Foco</option>
      <option value="descanso" data-translate="option_descanso">Descanso</option>
      <option value="alerta" data-translate="option_alerta">Alerta</option>
    </select>
    <button onclick="salvarNotificacao()" data-translate="save_button">➕ Salvar</button>
  </div>
</div>

<div id="mensagemLogin" style="display: none;">
  <p data-translate="login_to_see_notifications">Você precisa estar logado para ver e gerenciar suas notificações.</p>
  <p><a href="login.html" data-translate="do_login">Fazer Login</a> ou <a href="cadastro.html" data-translate="create_account">Criar Conta</a></p>
</div>

<footer data-translate="footer_text">
  © 2025 FocusHue™ — Sistema Cromático de Foco.
</footer>

<script src="menu.js"></script>
<script src="i18n.js"></script>
<script>
    // Lógica da página de notificações...
</script>

</body>
</html>
