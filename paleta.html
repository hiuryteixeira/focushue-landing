<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-translate="palette_page_title">Paleta de Cores - FocusHue</title>
  <style>
    /* Estilos... */
  </style>
</head>
<body>

<section class="circle-container">
  <span class="estudo" data-translate="label_estudo">Estudo</span>
  <span class="foco" data-translate="label_foco">Foco</span>
  <span class="descanso" data-translate="label_descanso">Descanso</span>
  <span class="alerta" data-translate="label_alerta">Alerta</span>
</section>

<section class="color-pickers">
  <div class="color-card">
    <label for="color-estudo" data-translate="color_study">Cor do Estudo</label>
    <input type="color" id="color-estudo" value="#6BAED6" onchange="updateColor('--estudo', this.value)">
  </div>
  <div class="color-card">
    <label for="color-foco" data-translate="color_focus">Cor do Foco</label>
    <input type="color" id="color-foco" value="#81C784" onchange="updateColor('--foco', this.value)">
  </div>
  <div class="color-card">
    <label for="color-descanso" data-translate="color_rest">Cor do Descanso</label>
    <input type="color" id="color-descanso" value="#F4E06D" onchange="updateColor('--descanso', this.value)">
  </div>
  <div class="color-card">
    <label for="color-alerta" data-translate="color_alert">Cor do Alerta</label>
    <input type="color" id="color-alerta" value="#EF9A9A" onchange="updateColor('--alerta', this.value)">
  </div>
</section>

<div class="reset-container">
  <button onclick="resetarCoresPadrao()" data-translate="restore_default_colors">🔄 Restaurar Cores Padrão</button>
</div>

<footer data-translate="footer_text">
  © 2025 FocusHue™ — Sistema Cromático de Foco.
</footer>

<script src="menu.js"></script>
<script src="i18n.js"></script>
<script>
  function updateColor(variable, color) {
    document.documentElement.style.setProperty(variable, color);
    localStorage.setItem(variable, color);
  }

  function carregarCoresSalvas() {
    const variaveis = ['--estudo', '--foco', '--descanso', '--alerta'];

    variaveis.forEach(variable => {
      const corSalva = localStorage.getItem(variable);
      if (corSalva) {
        document.documentElement.style.setProperty(variable, corSalva);
        const inputId = 'color-' + variable.replace('--', '');
        const input = document.getElementById(inputId);
        if (input) input.value = corSalva;
      }
    });
  }

  function resetarCoresPadrao() {
    const coresPadrao = {
      '--estudo': '#6BAED6',
      '--foco': '#81C784',
      '--descanso': '#F4E06D',
      '--alerta': '#EF9A9A'
    };

    Object.entries(coresPadrao).forEach(([variavel, valor]) => {
      localStorage.removeItem(variavel);
      document.documentElement.style.setProperty(variavel, valor);
      const inputId = 'color-' + variavel.replace('--', '');
      const input = document.getElementById(inputId);
      if (input) input.value = valor;
    });
  }

  window.addEventListener('DOMContentLoaded', carregarCoresSalvas);
</script>

</body>
</html>
