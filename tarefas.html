<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-translate="tasks_page_title">Minhas Tarefas - FocusHue</title>
  <style>
    /* Estilos ... */
    :root {
      --estudo: #6BAED6;
      --foco: #81C784;
      --descanso: #F4E06D;
      --alerta: #EF9A9A;
      --bg: #d7e3da;
      --text: #2e2e2e;
      --bg-dark: #1c1c1c;
      --text-dark: #eeeeee;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }
    .tarefas-section {
        max-width: 700px;
        margin: 30px auto;
        padding: 0 20px;
    }
    /* ... mais estilos ... */
  </style>
</head>
<body>

<section class="tarefas-section" id="tarefasSection" style="display: none;">
    <div class="tarefas-container" id="listaTarefas">
        <!-- Tarefas serão carregadas aqui -->
    </div>
    <div class="add-tarefa-container">
      <button onclick="abrirModalTarefa()" data-translate="add_task">➕ Adicionar Tarefa</button>
    </div>
</section>

<div id="mensagemLogin" style="display: none;">
  <p data-translate="login_to_see_tasks">Você precisa estar logado para ver e gerenciar suas tarefas.</p>
  <p><a href="login.html" data-translate="do_login">Fazer Login</a> ou <a href="cadastro.html" data-translate="create_account">Criar Conta</a></p>
</div>

<footer data-translate="footer_text">
  © 2025 FocusHue™ — Sistema Cromático de Foco.
</footer>

<div id="modalTarefa" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="fecharModalTarefa()">&times;</span>
    <h3 id="modalTitulo" data-translate="add_new_task">Adicionar Nova Tarefa</h3>
    <input type="hidden" id="tarefaId">
    <div>
      <label for="tarefaTitulo" data-translate="title_label">Título:</label>
      <input type="text" id="tarefaTitulo" data-translate="title_placeholder" placeholder="Ex: Preparar apresentação">
    </div>
    <div>
      <label for="tarefaTipo" data-translate="type_label">Tipo:</label>
      <select id="tarefaTipo">
        <option value="foco" data-translate="option_foco">Foco</option>
        <option value="estudo" data-translate="option_estudo">Estudo</option>
        <option value="descanso" data-translate="option_descanso">Descanso</option>
        <option value="alerta" data-translate="option_alerta">Alerta</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button class="cancel-btn" onclick="fecharModalTarefa()" data-translate="cancel">Cancelar</button>
      <button class="save-btn" onclick="salvarTarefa()" data-translate="save_button">Salvar</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<!-- My Scripts -->
<script src="menu.js"></script>
<script src="i18n.js"></script>

<script>
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let tarefasCache = [];

  function renderTarefas() {
    const lista = document.getElementById("listaTarefas");
    lista.innerHTML = "";
    if (!currentUser) return;

    const tarefasOrdenadas = tarefasCache.sort((a, b) => (b.createdAt?.toDate() || 0) - (a.createdAt?.toDate() || 0));

    tarefasOrdenadas.forEach((tarefa) => {
      const div = document.createElement("div");
      div.dataset.id = tarefa.id;
      const tipoClass = tarefa.tipo ? tarefa.tipo.toLowerCase() : 'foco';
      div.className = `tarefa ${tipoClass}`;
      
      div.innerHTML = `
        <div class="info">
            <div class="titulo">${tarefa.titulo || (translations[currentLanguage]?.untitled_task || 'Tarefa sem título')}</div>
            <div class="tipo">${tarefa.tipo || 'Foco'}</div>
        </div>
        <div class="botoes">
          <button onclick="abrirModalTarefa('${tarefa.id}')" data-translate="edit_button">✏️ Editar</button>
          <button onclick="excluirTarefa('${tarefa.id}')" data-translate="delete_button">🗑️ Excluir</button>
        </div>
      `;
      lista.appendChild(div);
    });
    translatePage(); // Re-apply translations to newly created buttons
  }

  async function carregarTarefas() {
      if (!currentUser) return;
      try {
          const tarefasRef = db.collection("users").doc(currentUser.uid).collection("tarefas");
          const snapshot = await tarefasRef.orderBy("createdAt", "desc").get();
          tarefasCache = [];
          snapshot.forEach(doc => tarefasCache.push({ id: doc.id, ...doc.data() }));
          renderTarefas();
      } catch (error) {
          console.error("Erro ao carregar tarefas:", error);
          alert(translations[currentLanguage]?.error_loading_tasks_alert || "Erro ao carregar suas tarefas. Tente recarregar a página.");
      }
  }

  const modal = document.getElementById("modalTarefa");
  const modalTitulo = document.getElementById("modalTitulo");

  function abrirModalTarefa(id = null) {
      if (id) {
          const tarefa = tarefasCache.find(t => t.id === id);
          if (tarefa) {
              modalTitulo.setAttribute('data-translate', 'edit_task');
              // ...
          }
      } else {
          modalTitulo.setAttribute('data-translate', 'add_new_task');
          // ...
      }
      translatePage();
      modal.style.display = "block";
  }

  function fecharModalTarefa() {
      modal.style.display = "none";
  }

  async function salvarTarefa() {
      if (!currentUser) return;
      const titulo = document.getElementById("tarefaTitulo").value.trim();
      if (!titulo) {
          alert(translations[currentLanguage]?.please_enter_title || "Por favor, digite um título para a tarefa.");
          return;
      }
      // ...
      try {
          // ...
      } catch (error) {
          console.error("Erro ao salvar tarefa:", error);
          alert((translations[currentLanguage]?.error_saving_task || "Erro ao salvar tarefa: {message}").replace('{message}', error.message));
      }
  }

  async function excluirTarefa(id) {
      if (!currentUser) return;
      const confirm_msg = translations[currentLanguage]?.confirm_delete_task || "Tem certeza que deseja excluir esta tarefa?";
      if (!confirm(confirm_msg)) return;

      try {
          await db.collection("users").doc(currentUser.uid).collection("tarefas").doc(id).delete();
          tarefasCache = tarefasCache.filter(t => t.id !== id);
          renderTarefas();
      } catch (error) {
          console.error("Erro ao excluir tarefa:", error);
          alert((translations[currentLanguage]?.error_deleting_task || "Erro ao excluir tarefa: {message}").replace('{message}', error.message));
      }
  }

  auth.onAuthStateChanged(user => {
      const tarefasSection = document.getElementById('tarefasSection');
      const mensagemLogin = document.getElementById('mensagemLogin');
      if (user) {
          currentUser = user;
          tarefasSection.style.display = 'block';
          mensagemLogin.style.display = 'none';
          carregarTarefas();
      } else {
          currentUser = null;
          tarefasSection.style.display = 'none';
          mensagemLogin.style.display = 'block';
          tarefasCache = [];
          renderTarefas();
      }
  });

  window.addEventListener('DOMContentLoaded', () => {
    window.onclick = (event) => {
      if (event.target === modal) {
        fecharModalTarefa();
      }
    };
  });
</script>
</body>
</html>
